<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFlix - Movies & Videos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 65px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #222;
    }

    .logo {
      color: #e50914;
      font-size: 27px;
      font-weight: bold;
    }

    .admin {
      background: #e50914;
      color: white;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
    }

    .hero {
      padding: 70px 6%;
      background: linear-gradient(90deg, #111, #222);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    main {
      padding: 30px 6%;
    }

    .search {
      width: 100%;
      max-width: 600px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 7px;
      background: #181818;
      color: white;
      font-size: 16px;
      margin-bottom: 30px;
      outline: none;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(200px, 1fr)
      );
      gap: 22px;
    }

    .card {
      background: #171717;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .poster {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: #222;
    }

    .no-poster {
      height: 280px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin-bottom: 8px;
      font-size: 18px;
    }

    .info p {
      color: #999;
      font-size: 14px;
      min-height: 40px;
    }

    .watch {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .download {
      display: inline-block;
      margin-top: 12px;
      margin-left: 5px;
      padding: 10px 14px;
      background: #198754;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .empty {
      color: #777;
      font-size: 18px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #666;
      margin-top: 50px;
    }

    @media(max-width:600px) {
      .hero h1 {
        font-size: 32px;
      }

      .poster,
      .no-poster {
        height: 240px;
      }

      .download {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">MYFLIX</div>
  <a class="admin" href="/login.html">Admin</a>
</header>

<section class="hero">
  <h1>🎬 Welcome to MyFlix</h1>
  <p>Watch your favourite videos online.</p>
</section>

<main>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔎 Search videos..."
    oninput="showVideos()"
  >

  <div id="videos"></div>

</main>

<footer>
  © 2026 MyFlix
</footer>

<script>

let videos = [];

async function getVideos() {

  try {

    const response = await fetch("/api/videos");

    if (!response.ok) {
      throw new Error("Server error");
    }

    videos = await response.json();

    showVideos();

  } catch (error) {

    document.getElementById("videos").innerHTML =
      `<p class="empty">
        Videos load नहीं हो पाए। Server check करें।
      </p>`;

  }

}

function showVideos() {

  const box = document.getElementById("videos");

  const search =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const filtered = videos.filter(video =>
    video.title.toLowerCase().includes(search)
  );

  box.innerHTML = "";

  if (filtered.length === 0) {

    box.innerHTML =
      `<p class="empty">अभी कोई video उपलब्ध नहीं है।</p>`;

    return;

  }

  filtered.forEach(video => {

    const card = document.createElement("div");

    card.className = "card";

    let poster = "";

    if (video.thumbnail) {

      poster =
        `<img
          class="poster"
          src="/thumbnail/${video.id}"
          alt="Thumbnail"
        >`;

    } else {

      poster =
        `<div class="no-poster">🎬</div>`;

    }

    card.innerHTML = `

      ${poster}

      <div class="info">

        <h3>
          ${escapeHTML(video.title)}
        </h3>

        <p>
          ${escapeHTML(video.description || "")}
        </p>

        <a
          class="watch"
          href="/watch.html?id=${video.id}"
        >
          ▶ Watch
        </a>

        <a
          class="download"
          href="/download/${video.id}"
        >
          ⬇ Download
        </a>

      </div>
    `;

    box.appendChild(card);

  });

}

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

getVideos();

</script>

</body>
</html>
